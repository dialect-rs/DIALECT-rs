dynamics_type = "surface_hopping"
nstep = 100
stepsize = 0.1
restart = false
nstates = 8
coupling = "nacv"

[initial_conditions]
states = [2]
velocities = "boltzmann"
temperature = 300.0

[electronic_integration]
method = "local_diabatisation"
substeps = 1000

[surface_hopping]
decoherence_correction = true
force_switch_to_gs = true
force_switch_s0s1_threshold = 0.1
rescale_at_frustrated_hop = false
artificial_energy_conservation = false

[output]
restart = true
coordinates = true
energies = true
temperature = true
state = true
