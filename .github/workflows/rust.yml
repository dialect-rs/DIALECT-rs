name: Rust

on:
  push:
    branches: [ "new_main" ]
  pull_request:
    branches: [ "new_main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      DIALECT_SRC_DIR: /home/runner/work/dialect_atomic/dialect_atomic

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
